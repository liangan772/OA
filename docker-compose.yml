services:
  postgres:
    image: postgres:16-alpine
    container_name: oooa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oooa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oooa}
      POSTGRES_DB: oooa
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oooa -d oooa']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: oooa-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: oooa-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://oooa:${POSTGRES_PASSWORD:-oooa}@postgres:5432/oooa?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${SERVER_PORT:-3001}:3001'
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node dist/main"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: oooa-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  redisdata:
